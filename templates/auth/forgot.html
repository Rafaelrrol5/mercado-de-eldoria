{% extends 'base.html' %}{% block content %}<section class="auth-section"><form class="auth-card" method="post" data-auth-form><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">Recuperação de acesso</p><h1>Esqueceu a senha?</h1><p>Informe o e-mail da sua conta para solicitar um link válido por uma hora.</p><div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email"><small data-field-message aria-live="polite"></small></div><button class="button button-block">Solicitar link</button><p><a class="text-link" href="{{ url_for('auth.login') }}">← Voltar para entrar</a></p></form></section>{% endblock %}
