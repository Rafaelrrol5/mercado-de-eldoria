{% macro password(name='password',label='Senha',new=false) %}
<div class="field"><label for="{{ name }}">{{ label }}</label><div class="password-control"><input id="{{ name }}" name="{{ name }}" type="password" required maxlength="128" {% if new %}minlength="8" data-new-password autocomplete="new-password" aria-describedby="{{ name }}-rules"{% else %}autocomplete="current-password"{% endif %}><button type="button" data-password-toggle aria-controls="{{ name }}" aria-label="Mostrar {{ label|lower }}" aria-pressed="false" title="Mostrar senha"><svg class="password-eye" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="password-eye-slash" d="m3 3 18 18"/></svg></button></div>{% if new %}<small id="{{ name }}-rules" data-password-rules="{{ name }}">Use de 8 a 128 caracteres, incluindo letras e números.</small>{% endif %}<small data-field-message aria-live="polite"></small></div>
{% endmacro %}
