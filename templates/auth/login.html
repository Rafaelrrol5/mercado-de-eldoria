{% extends 'base.html' %}{% from 'auth/_fields.html' import password %}{% block content %}<section class="auth-section"><form class="auth-card" method="post" data-auth-form><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">Conta do aventureiro</p><h1>Entrar</h1><p>Acesse seus pedidos e solicitações.</p>{% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}<div class="field"><label for="email">E-mail</label><input id="email" type="email" name="email" required maxlength="254" autocomplete="username" value="{{ request.form.get('email','') }}"><small data-field-message aria-live="polite"></small></div>{{ password() }}<p><a class="text-link" href="{{ url_for('account_security.forgot') }}">Esqueci minha senha</a></p><button class="button button-block" type="submit">Entrar</button><p>Não possui conta? <a class="text-link" href="{{ url_for('auth.register') }}">Criar conta</a></p></form></section>{% endblock %}
