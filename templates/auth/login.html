{% extends 'base.html' %}{% block content %}<section class="auth-section"><form class="auth-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">Conta do aventureiro</p><h1>Entrar</h1><p>Acesse seus pedidos e solicitações.</p><div class="field"><label for="email">Email</label><input id="email" type="email" name="email" required autocomplete="email"></div><div class="field"><label for="password">Senha</label><input id="password" type="password" name="password" required autocomplete="current-password"></div><button class="button button-block" type="submit">Entrar</button><p>Não possui conta? <a class="text-link" href="{{ url_for('auth.register') }}">Criar conta</a></p></form></section>{% endblock %}
