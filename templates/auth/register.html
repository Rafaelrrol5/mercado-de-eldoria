{% extends 'base.html' %}{% block content %}<section class="auth-section"><form class="auth-card" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">Novo aventureiro</p><h1>Criar conta</h1><div class="field"><label for="name">Nome</label><input id="name" name="name" required minlength="2" maxlength="80" autocomplete="name"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email"></div><div class="field"><label for="game">Conta do jogo <span>(opcional)</span></label><input id="game" name="game_identifier" maxlength="80" placeholder="Aventureiro#1042"></div><div class="field"><label for="password">Senha</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password"><small>Use pelo menos 8 caracteres, letras e números.</small></div><button class="button button-block" type="submit">Criar conta</button><p>Já possui conta? <a class="text-link" href="{{ url_for('auth.login') }}">Entrar</a></p></form></section>{% endblock %}
