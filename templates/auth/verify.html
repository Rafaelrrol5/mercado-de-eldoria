{% extends 'base.html' %}{% block content %}<section class="auth-section"><div class="auth-card"><p class="eyebrow">Seu endereço de e-mail</p><h1>Confirmar e-mail</h1>{% if valid %}<p>Confirme que este endereço pertence a você.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button button-block">Confirmar meu e-mail</button></form>{% else %}<p>Este link expirou, já foi utilizado ou não é válido. Entre na sua conta para solicitar outro.</p><a class="button" href="{{ url_for('store.account') }}">Minha conta</a>{% endif %}</div></section>{% endblock %}
