{% extends 'admin/base.html' %}{% from 'auth/_fields.html' import password %}{% block admin_content %}<section class="auth-section"><form class="auth-card" method="post" data-auth-form><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">Acesso restrito</p><h1>Administração</h1>{% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}<div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="username" value="{{ request.form.get('email','') }}"><small data-field-message aria-live="polite"></small></div>{{ password() }}<button class="button button-block">Entrar</button></form></section>{% endblock %}
