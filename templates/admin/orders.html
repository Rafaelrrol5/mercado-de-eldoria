{% extends 'admin/manage_base.html' %}{% from 'admin/_macros.html' import order_list %}
{% block management_content %}<form class="admin-search"><input name="q" value="{{ q }}" placeholder="Pedido, nome ou e-mail" aria-label="Buscar pedidos"><select name="status" aria-label="Status"><option value="">Todos os status</option>{% for s in ['AWAITING_PAYMENT','PAID','PROCESSING','DELIVERED','REFUNDED','CANCELLED'] %}<option {{ 'selected' if state==s else '' }}>{{ s }}</option>{% endfor %}</select><button class="button">Pesquisar</button></form><p class="form-help">Até 200 resultados por busca. Abra o pedido para ver o cliente, itens e atualizar o andamento.</p><div data-live-region="orders">{{ order_list(rows) }}</div>{% endblock %}
