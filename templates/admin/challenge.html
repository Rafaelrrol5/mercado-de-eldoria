{% extends 'admin/base.html' %}{% block admin_content %}<section class="auth-section"><form class="auth-card" method="post" data-auth-form><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="eyebrow">Segunda etapa</p><h1>Verificar acesso</h1><p>Informe o código do seu aplicativo autenticador ou um código de recuperação.</p>{% if error %}<p class="auth-error" role="alert">{{ error }}</p>{% endif %}<div class="field"><label for="code">Código de acesso</label><input id="code" name="code" required autocomplete="one-time-code" maxlength="32" autofocus></div><button class="button button-block">Verificar</button><p><a class="text-link" href="{{ url_for('admin.login') }}">Voltar para o login</a></p></form></section>{% endblock %}
